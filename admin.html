<!DOCTYPE html>
<html lang="fo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stýring | System</title>
    <style>
        /* ===========================
           :root - Colors & variables (1-to-1)
           =========================== */
        :root {
            color-scheme: light dark;
            --bg: #050816;
            --bg-elevated: #0b1020;
            --bg-soft: #111827;
            --text: #e5e7eb;
            --text-soft: #9ca3af;
            --accent: #38bdf8;
            --accent-strong: #0ea5e9;
            --radius-lg: 18px;
            --radius-md: 12px;
            --transition-fast: 180ms ease-out;
            --transition-med: 280ms ease-out;
        }

        /* ===========================
           Base Reset
           =========================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, #0b1120 0, #020617 55%, #000 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            padding: 16px;
        }

        /* ===========================
           Admin Card (Matches .lock-panel)
           =========================== */
        .admin-card {
            max-width: 420px;
            width: 100%;
            border-radius: var(--radius-lg);
            background: radial-gradient(circle at top left, #0f172a, #020617 70%);
            border: 1px solid rgba(56, 189, 248, 0.4);
            box-shadow: 0 28px 70px rgba(15, 23, 42, 0.95);
            padding: 40px;
            text-align: center;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 20px;
            transition: all var(--transition-med);
        }

        .status-badge.online { 
            background: rgba(16, 185, 129, 0.1); 
            color: #10b981; 
            border: 1px solid rgba(16, 185, 129, 0.2); 
        }
        .status-badge.offline { 
            background: rgba(239, 68, 68, 0.1); 
            color: #ef4444; 
            border: 1px solid rgba(239, 68, 68, 0.2); 
        }

        h2 { 
            font-size: 1.75rem; 
            font-weight: 700; 
            margin-bottom: 12px;
            background: linear-gradient(135deg, var(--accent), #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p { 
            color: var(--text-soft); 
            font-size: 1rem; 
            line-height: 1.6;
            margin-bottom: 32px; 
        }

        /* ===========================
           Form Elements (Sized 1-to-1)
           =========================== */
        input, .btn-toggle {
            display: block;
            width: 100%;
            font-size: 1rem;
            font-family: inherit;
            border-radius: var(--radius-md);
            transition: all var(--transition-fast);
        }

        input {
            padding: 14px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(56, 189, 248, 0.2);
            color: var(--text);
            margin-bottom: 16px;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
            background: rgba(15, 23, 42, 0.9);
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.1);
        }

        .btn-toggle {
            padding: 14px;
            background: var(--accent);
            color: #020617;
            font-weight: 700;
            border: 1px solid var(--accent); /* Matches input border height */
            cursor: pointer;
        }

        .btn-toggle:hover {
            background: var(--accent-strong);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(14, 165, 233, 0.3);
        }

        .btn-toggle:active {
            transform: scale(0.98);
        }

    </style>
</head>
<body>

    <div class="admin-card">
        <div id="status-badge" class="status-badge">Kanna eftir...</div>
        <h2>Stýring</h2>
        <p>Broyt støðuna á heimasíðuni her.</p>

        <input type="password" id="admin-pass" placeholder="Loyniorð">
        <button id="toggle-btn" class="btn-toggle">Dagfør støðu</button>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const client = createClient(
            "https://rtiddewyylgihlgsugmi.supabase.co",
            "sb_publishable_fLwMwlg1k5QC5z1fOf81eg_3YiQln25"
        );

        const badge = document.getElementById('status-badge');
        const toggleBtn = document.getElementById('toggle-btn');
        const passInput = document.getElementById('admin-pass');
        let currentStatus = false;

        async function fetchStatus() {
            const { data } = await client.from('site_config').select('isOpen').eq('id', 1).maybeSingle();
            if (data) {
                currentStatus = data.isOpen;
                
                // Update Badge Text
                badge.innerText = currentStatus ? "● Síðan er opin" : "● Síðan er læst";
                badge.className = `status-badge ${currentStatus ? 'online' : 'offline'}`;
                
                // Update Button Text based on state
                // If currently open -> button says "Læs síðuna" (Lock site)
                // If currently locked -> button says "Opna síðuna" (Open site)
                toggleBtn.innerText = currentStatus ? "Læs síðuna" : "Opna síðuna";
            }
        }

        toggleBtn.onclick = async () => {
            const enteredPass = passInput.value;

            // Fetch secret from DB
            const { data: secretData } = await client
                .from('site_secrets')
                .select('key_value')
                .eq('key_name', 'admin_password')
                .maybeSingle();

            if (!secretData || enteredPass !== secretData.key_value) {
                alert("Skeivt loyniorð.");
                return;
            }

            // Update site state
            const { error } = await client
                .from('site_config')
                .update({ isOpen: !currentStatus })
                .eq('id', 1);

            if (!error) {
                passInput.value = ""; 
                fetchStatus();
            } else {
                alert("Feilur: " + error.message);
            }
        };

        fetchStatus();
    </script>
</body>
</html>
